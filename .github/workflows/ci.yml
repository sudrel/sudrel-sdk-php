name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  sintaxe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
      - run: composer validate --strict
      - run: find src -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Conferir o pacote distribuído
        run: |
          mkdir -p "$RUNNER_TEMP/pacote" "$RUNNER_TEMP/cliente"
          composer archive --format=zip --file=sudrel-sdk --dir="$RUNNER_TEMP/pacote"
          unzip -q "$RUNNER_TEMP/pacote/sudrel-sdk.zip" -d "$RUNNER_TEMP/cliente"
          composer install --working-dir="$RUNNER_TEMP/cliente" --no-interaction --no-dev
          php tests/distribuicao.php "$RUNNER_TEMP/cliente/vendor/autoload.php"
      - name: Conferir instalação a partir do Packagist
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p "$RUNNER_TEMP/packagist"
          composer require sudrel/sdk:0.2.0 --working-dir="$RUNNER_TEMP/packagist" --no-interaction --update-no-dev
          php tests/distribuicao.php "$RUNNER_TEMP/packagist/vendor/autoload.php"
